name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-tests:
    name: Skill tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.x"]   # oldest supported, middle, latest stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml
      - run: pytest

  generated-project:
    name: Generated ${{ matrix.pattern }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern: [single_call, workflow, sdk_agent, custom_loop, orchestrator, mcp_server]
    env:
      SKILL: ${{ github.workspace }}/skills/agent-architect
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Scaffold
        run: |
          NAME="ci-$(echo '${{ matrix.pattern }}' | tr '_' '-')"
          echo "PROJECT=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"
          python "$SKILL/scripts/scaffold.py" --name "$NAME" --dest "$RUNNER_TEMP" \
            --pattern ${{ matrix.pattern }} --model claude-sonnet-5-5
      - name: Install generated project
        working-directory: ${{ env.PROJECT }}
        run: pip install -e ".[dev]"
      - name: Generated project's own tests (no API key)
        working-directory: ${{ env.PROJECT }}
        run: pytest -q
      - name: Eval set is well formed
        working-directory: ${{ env.PROJECT }}
        run: python evals/run_evals.py --dry-run
      - name: Audit gates on placeholders, then passes
        run: python .github/scripts/check_generated.py "$SKILL/scripts/audit.py" "$PROJECT"

  install-smoke:
    name: Install with the skills CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"   # skills CLI needs Node 22.20+
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Repo exposes the skill
        run: |
          npx -y skills@latest add "$GITHUB_WORKSPACE" --list | tee list.txt
          grep -q agent-architect list.txt
      - name: Install into a fresh project and use it
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          npx -y skills@latest add "$GITHUB_WORKSPACE" --skill agent-architect -a claude-code -y --copy
          test -f .claude/skills/agent-architect/SKILL.md
          python .claude/skills/agent-architect/scripts/scaffold.py --name smoke --dest . \
            --pattern single_call --model claude-sonnet-5-5
          python .claude/skills/agent-architect/scripts/audit.py smoke --json > audit.json || true
          python -c "import json; r = json.load(open('audit.json')); rules = {f['rule'] for f in r['findings']}; assert rules == {'V4'}, r; print('installed skill works:', rules)"
